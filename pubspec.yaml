name: joycomic
description: "JoyComic - 哔咔 & 禁漫双源 iOS 漫画阅读器。"
publish_to: "none"

# iOS: build-name -> CFBundleShortVersionString, build-number -> CFBundleVersion
version: 0.1.0+1

environment:
  sdk: ">=3.10.0 <4.0.0"
  flutter: ">=3.32.0"

# 依赖说明：
# - 纯 Dart/Flutter 实现，不引入额外 native 语言：本工程用 archive（zip）+ pdf 替代离线归档能力
# - 网络层：dio + crypto + pointycastle + uuid + image
# - 状态管理（阶段4重点）：provider
# - 本地存储（阶段4重点）：sqlite3 / sqlite3_flutter_libs
# - 阅读器缩放：photo_view
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # 网络
  dio: ^5.7.0
  dio_cookie_manager: ^3.1.1
  cookie_jar: ^4.0.8

  # 加密 / 签名（哔咔 HMAC-SHA256、禁漫 AES-ECB + md5 token）
  crypto: ^3.0.6
  pointycastle: ^3.9.1
  uuid: ^4.5.1

  # 图片处理（禁漫图片分割重组基于 image 包）
  image: ^4.3.0

  # 路由
  go_router: ^16.0.0

  # 本地持久化（源 token / 设置）
  shared_preferences: ^2.3.3
  flutter_secure_storage: ^9.2.4
  path_provider: ^2.1.5

  # 图片加载与显示（阅读器缩放）
  # 用社区版 cached_network_image_ce：官方 cached_network_image 自 2024-08 起停止维护
  # （3.4.1 为末版、300+ issue 未修，含内存泄漏/滚动卡顿），ce 版活跃维护（4.9.0/2026-06）、
  # 99% API 兼容官方、缓存引擎 SQLite→Hive 性能更优。 同样用 ce 版，移植零适配。
  cached_network_image_ce: ^4.9.0
  photo_view: ^0.15.0

  # 阅读器竖直连续模式的可定位滚动列表（竖直流定位 + 自定义 InteractiveViewer）。
  # 注意： 用的是自 fork 版（raoxwup/scrollable_positioned_list ref 193c9c0），
  # 先用 pub 官方 0.3.8（Google google/flutter.widgets，3年前末版）起步；
  # 移植中若遇定位 bug 再回退到  fork ref。
  scrollable_positioned_list: ^0.3.8
  # 缩放手势与矩阵变换（竖直模式自定义双击放大 Matrix4Tween）
  vector_math: ^2.2.0
  # 预加载并发限流池
  pool: ^1.5.2

  # 状态管理（阶段4 重点使用）
  provider: ^6.1.5

  # 本地数据库（阶段4 重点）
  sqlite3: ^2.4.0
  sqlite3_flutter_libs: ^0.5.28

  # 工具
  url_launcher: ^6.3.2
  path: ^1.9.0
  collection: ^1.18.0
  archive: ^4.0.0          # 纯 Dart 的 zip 归档能力（离线打包下载章节）

  # 以图搜图
  image_picker: ^1.1.2

  # 日志
  logger: ^2.5.0
  jiffy: ^6.3.2

  # 日志导出分享
  share_plus: ^10.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  ios: true
  image_path: "assets/app.jpg"
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/
  fonts:
    - family: LXGWWenKai
      fonts:
        - asset: assets/fonts/LXGWWenKai-Regular.ttf
          weight: 400
        - asset: assets/fonts/LXGWWenKai-Bold.ttf
          weight: 700
