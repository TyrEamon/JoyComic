# JoyComic Codemagic CI/CD
workflows:
  build-ipa:
    name: Build IPA
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      flutter: stable
      xcode: latest
      vars:
        APP_NAME: "JoyComic"
    triggering:
      events:
        - push
        - tag
      branch_patterns:
        - pattern: main
          include: true
    scripts:
      - name: Generate iOS project files
        script: |
          if [ ! -d "ios" ]; then
            flutter create . --platforms=ios
          fi
          /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryUsageDescription string 选择漫画图片用于以图搜图" ios/Runner/Info.plist 2>/dev/null || /usr/libexec/PlistBuddy -c "Set :NSPhotoLibraryUsageDescription 选择漫画图片用于以图搜图" ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string 拍摄漫画图片用于以图搜图" ios/Runner/Info.plist 2>/dev/null || /usr/libexec/PlistBuddy -c "Set :NSCameraUsageDescription 拍摄漫画图片用于以图搜图" ios/Runner/Info.plist
          # Disable Impeller: reader frames decode + layout OK but stay black on some iOS devices.
          /usr/libexec/PlistBuddy -c "Add :FLTEnableImpeller bool false" ios/Runner/Info.plist 2>/dev/null || /usr/libexec/PlistBuddy -c "Set :FLTEnableImpeller false" ios/Runner/Info.plist
      - name: Generate app icons
        script: |
          flutter pub get
          dart run flutter_launcher_icons
      - name: Install dependencies
        script: flutter pub get
      - name: Build unsigned IPA
        script: |
          VERSION=$(grep 'version:' pubspec.yaml | head -1 | awk '{print $2}')
          BN=$(($(git rev-list --count HEAD)))
          echo "Building v$VERSION ($BN)"

          # 在 xcconfig 中写入 dummy team（Flutter 3.32+ 校验需要）
          # 同时关闭 lib 签名，让 xcodebuild 用 dummy team 时不会报错
          tee -a ios/Flutter/Release.xcconfig << END

          DEVELOPMENT_TEAM=0000000000
          CODE_SIGN_STYLE=Manual
          CODE_SIGNING_ALLOWED=NO
          CODE_SIGNING_REQUIRED=NO
          END

          flutter build ios --release \
            --build-name=$VERSION \
            --build-number=$BN 2>&1
      - name: Package IPA
        script: |
          APP_PATH=$(find build/ios -name "*.app" -type d | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "No .app found!"
            exit 1
          fi
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          IPA_NAME="joycomic-unsigned.ipa"
          zip -r "$IPA_NAME" Payload/
          echo "IPA_NAME=$IPA_NAME" >> $CM_ENV
    artifacts:
      - joycomic-*.ipa
    publishing:
      email:
        recipients:
          - builder@example.com
