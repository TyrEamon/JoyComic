# JoyComic Codemagic CI/CD
# 在 codemagic.io 连接此仓库后自动触发。
#
# 首次运行时会在 macOS CI 上自动补全 ios/ 目录
# （flutter create . --platforms=ios）并生成应用图标。
workflows:
  build-ipa:
    name: Build IPA
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      flutter: stable
      xcode: latest
      vars:
        APP_NAME: "JoyComic"
    triggering:
      events:
        - push
        - tag
      branch_patterns:
        - pattern: main
          include: true
    scripts:
      - name: Generate iOS project files
        script: |
          # ios/ 目录不存在时生成（首次运行或 git 未跟踪时）
          if [ ! -d "ios" ]; then
            flutter create . --platforms=ios
          fi
      - name: Generate app icons
        script: |
          flutter pub get
          dart run flutter_launcher_icons
      - name: Install dependencies
        script: flutter pub get
      - name: Build unsigned IPA
        script: |
          # 在 xcconfig 中写入 dummy Development Team（Flutter 3.32+ 要求）
          echo "" >> ios/Flutter/Release.xcconfig
          echo "DEVELOPMENT_TEAM=0000000000" >> ios/Flutter/Release.xcconfig
          echo "CODE_SIGN_STYLE=Manual" >> ios/Flutter/Release.xcconfig
          echo "CODE_SIGNING_ALLOWED=NO" >> ios/Flutter/Release.xcconfig
          echo "CODE_SIGNING_REQUIRED=NO" >> ios/Flutter/Release.xcconfig

          flutter build ios --release --no-codesign \
            --build-name=$(grep 'version:' pubspec.yaml | head -1 | awk '{print $2}') \
            --build-number=$(($(git rev-list --count HEAD)))
      - name: Package IPA
        script: |
          APP_PATH=$(find build/ios/iphoneos -name "*.app" -type d | head -1)
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          IPA_NAME="joycomic-$(git describe --tags --always 2>/dev/null || echo unsigned).ipa"
          zip -r "$IPA_NAME" Payload/
          echo "IPA_NAME=$IPA_NAME" >> $CM_ENV
    artifacts:
      - joycomic-*.ipa
    publishing:
      email:
        recipients:
          - builder@example.com
