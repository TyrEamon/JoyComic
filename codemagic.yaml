# JoyComic Codemagic CI/CD
workflows:
  build-ipa:
    name: Build IPA
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      flutter: stable
      xcode: latest
      vars:
        APP_NAME: "JoyComic"
    triggering:
      events:
        - push
        - tag
      branch_patterns:
        - pattern: main
          include: true
    scripts:
      - name: Generate iOS project files
        script: |
          if [ ! -d "ios" ]; then
            flutter create . --platforms=ios
          fi
      - name: Generate app icons
        script: |
          flutter pub get
          dart run flutter_launcher_icons
      - name: Install dependencies
        script: flutter pub get
      - name: Build unsigned IPA
        script: |
          VERSION=$(grep 'version:' pubspec.yaml | head -1 | awk '{print $2}')
          BN=$(($(git rev-list --count HEAD)))
          echo "Building version $VERSION ($BN)"

          # Flutter 3.29+ 中 --no-codesign 可能不可用，这里硬编码签名设置
          cd ios
          # 设置 dummy development team 让 Flutter 校验通过
          echo 'DEVELOPMENT_TEAM=0000000000' >> Flutter/Release.xcconfig
          echo 'CODE_SIGN_STYLE=Manual' >> Flutter/Release.xcconfig
          cd ..

          # 构建（会尝试签名但 .app 仍会生成）
          flutter build ios --release \
            --build-name=$VERSION \
            --build-number=$BN 2>&1 | tail -10 || true

          # 查找生成的 .app
          APP_PATH=$(find build/ios/iphoneos -name "*.app" -type d | head -1)
          if [ -z "$APP_PATH" ]; then
            # flutter build 可能没生成 iphoneos 目录，尝试其他路径
            APP_PATH=$(find build/ios -name "*.app" -type d | head -1)
          fi
          echo "Found app at: $APP_PATH"
      - name: Package IPA
        script: |
          APP_PATH=$(find build/ios -name "*.app" -type d | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "No .app found!"
            exit 1
          fi
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          IPA_NAME="joycomic-unsigned.ipa"
          zip -r "$IPA_NAME" Payload/
          echo "IPA_NAME=$IPA_NAME" >> $CM_ENV
    artifacts:
      - joycomic-*.ipa
    publishing:
      email:
        recipients:
          - builder@example.com
